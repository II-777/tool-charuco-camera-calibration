[project]
name = "charuco-calib"
version = "0.1.0"
description = "Calibrate a camera from an RTSP stream of a printed ChArUco sheet."
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "numpy>=1.26",
    "opencv-python>=4.10",
    "pyyaml>=6",
]

[project.scripts]
charuco-calib = "charuco_calib.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["charuco_calib"]

[tool.pytest.ini_options]
testpaths = ["tests"]
